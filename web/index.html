<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./site/">
  <title>Homebound &mdash; Redirecting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared/base.css">
  <script>
    window.location.replace('./site/' + window.location.search + window.location.hash);
  </script>
  <style>
    .redirect-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .redirect-card {
      max-width: 440px;
      width: 100%;
      padding: 2.25rem 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <div class="redirect-container">
    <div class="card glass redirect-card">
      <span class="wristband-chip band-orange">Homebound</span>
      <h1 style="font-size: var(--text-20); margin: 0.25rem 0;">Redirecting to Homebound...</h1>
      <p class="text-muted" style="font-size: var(--text-14);">
        If you are not redirected automatically, tap the link below.
      </p>
      <a href="./site/" class="btn btn-primary" style="min-height: 44px; margin-top: 0.5rem;">
        Open Homebound
      </a>
    </div>
  </div>
</body>
</html>
