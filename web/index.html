<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homebound - Party Safety Bands</title>
  <link rel="stylesheet" href="./shared/base.css">
  <script>
    // Automatically route root visitors to the landing page
    if (!window.location.search && !window.location.hash) {
      window.location.replace('./site/');
    }
  </script>
  <style>
    .root-portal {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
      margin-top: 1.5rem;
    }
    @media (min-width: 480px) {
      .nav-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="root-portal">
    <div class="card" style="max-width: 540px; width: 100%; text-align: center; padding: 2rem 1.5rem;">
      <h1 style="margin-bottom: 0.5rem;">Homebound</h1>
      <p class="text-muted">Party safety bands & zero-server event check-in.</p>

      <div class="nav-grid">
        <a href="./site/" class="btn btn-primary">
          About & Pilot
        </a>
        <a href="./setup/" class="btn btn-secondary">
          Connect Sheet
        </a>
        <a href="./door/" class="btn btn-green">
          Door Scanner
        </a>
        <a href="./dashboard/" class="btn btn-secondary">
          Live Dashboard
        </a>
        <a href="./admin/" class="btn btn-secondary" style="grid-column: 1 / -1;">
          Organizer Admin
        </a>
      </div>
    </div>
  </div>
</body>
</html>
