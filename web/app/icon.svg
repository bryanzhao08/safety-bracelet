<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="bg-glow-tr" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#0B2A45" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-bl" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#5AC8FA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Pass Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CAFFA" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#8CAFFA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B2A45" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#BED7FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8CAFFA" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glass Drop Shadow Filter -->
    <filter id="glass-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#02081E" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Midnight Background -->
  <rect width="512" height="512" fill="#000000"/>
  <rect width="512" height="512" fill="url(#bg-glow-tr)"/>
  <rect width="512" height="512" fill="url(#bg-glow-bl)"/>

  <!-- Glass Pass Card (centered in safe zone, 240x330, r=28) -->
  <g filter="url(#glass-shadow)">
    <!-- Pass Base Fill -->
    <rect x="136" y="91" width="240" height="330" rx="28" fill="url(#glass-grad)"/>

    <!-- Pass Inner Highlight & Rim Border -->
    <rect x="136" y="91" width="240" height="330" rx="28" fill="none" stroke="url(#rim-grad)" stroke-width="2.5"/>
    <!-- Top inner highlight line -->
    <path d="M 164 92.5 L 348 92.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Pass Header Elements -->
    <!-- Signal Accent Dot -->
    <circle cx="166" cy="126" r="5" fill="#5AC8FA"/>
    <!-- Name bar -->
    <rect x="180" y="121" width="95" height="10" rx="5" fill="#F5F7FA"/>
    <!-- Handle bar -->
    <rect x="180" y="137" width="65" height="6" rx="3" fill="#A1AAB8" fill-opacity="0.75"/>

    <!-- QR Inset Window (White rounded container) -->
    <g transform="translate(161, 162)">
      <rect width="190" height="190" rx="18" fill="#FFFFFF"/>

      <!-- QR Pattern (clean, high-contrast #000000 on #FFFFFF, 25x25 grid, scale 6.4) -->
      <g transform="translate(15, 15) scale(6.4)" fill="#000000" shape-rendering="crispEdges">
        <!-- Top-Left Finder (7x7) -->
        <path d="M0,0 h7 v7 h-7 z M1,1 v5 h5 v-5 z M2,2 h3 v3 h-3 z"/>
        <!-- Top-Right Finder (7x7) -->
        <path d="M18,0 h7 v7 h-7 z M19,1 v5 h5 v-5 z M20,2 h3 v3 h-3 z"/>
        <!-- Bottom-Left Finder (7x7) -->
        <path d="M0,18 h7 v7 h-7 z M1,19 v5 h5 v-5 z M2,20 h3 v3 h-3 z"/>

        <!-- Timing Patterns -->
        <path d="M6,8 h1 v1 h-1 z M6,10 h1 v1 h-1 z M6,12 h1 v1 h-1 z M6,14 h1 v1 h-1 z M6,16 h1 v1 h-1 z"/>
        <path d="M8,6 h1 v1 h-1 z M10,6 h1 v1 h-1 z M12,6 h1 v1 h-1 z M14,6 h1 v1 h-1 z M16,6 h1 v1 h-1 z"/>

        <!-- Alignment Pattern (center-ish right) -->
        <path d="M16,16 h5 v5 h-5 z M17,17 v3 h3 v-3 z M18,18 h1 v1 h-1 z"/>

        <!-- Sample Data Dots -->
        <rect x="9" y="1" width="1" height="2"/>
        <rect x="12" y="0" width="2" height="1"/>
        <rect x="15" y="2" width="1" height="3"/>
        <rect x="8" y="9" width="2" height="1"/>
        <rect x="12" y="8" width="1" height="2"/>
        <rect x="14" y="10" width="2" height="2"/>
        <rect x="8" y="12" width="1" height="3"/>
        <rect x="10" y="14" width="3" height="1"/>
        <rect x="12" y="17" width="2" height="1"/>
        <rect x="9" y="20" width="1" height="2"/>
        <rect x="13" y="22" width="2" height="2"/>
        <rect x="23" y="9" width="1" height="3"/>
        <rect x="22" y="13" width="2" height="1"/>
        <rect x="23" y="17" width="1" height="2"/>
        <rect x="22" y="22" width="2" height="1"/>
      </g>
    </g>

    <!-- Pass Bottom Wordmark / Pill -->
    <rect x="226" y="375" width="60" height="6" rx="3" fill="#8CAFFA" fill-opacity="0.3"/>
  </g>
</svg>