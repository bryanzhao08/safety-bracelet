<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAMVA PDF417 Parser Test Suite</title>
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    /* For standalone testing */
    .sample-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    pre {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <span class="brand-icon">✓</span>
      <span>AAMVA PDF417 Parser Verification</span>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
    <h1>Synthetic Barcode Test Suite</h1>
    <p class="text-muted mt-sm mb-lg">
      Verifies extraction of name (DAC/DCS/DCT), dates (MMDDYYYY &amp; YYYYMMDD), jurisdiction (DAJ), and license number (DAQ).
    </p>

    <div id="results"></div>
  </main>

  <script type="module" src="/shared/aamva.test.js"></script>
</body>
</html>
